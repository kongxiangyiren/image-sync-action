name: Docker sync images

on:
  workflow_dispatch:
  schedule:
    #   # every day at 7am & 7pm pacific
    - cron: '0 2,14 * * *'
  push:
    branches:
      - main
    paths-ignore: # 这里表示忽略的文件或目录，不会触发流程
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'
      - '.test/**'
      - '.dockerignore'
      - 'Dockerfile'
      - '.github/**'
      - 'auth.yaml'

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: hhyasdf/image-sync-action@v1.1
        with:
          auth_file: ./auth.yaml
          images_file: ./images.yaml
          version: latest
          proc: 5
          # arch: arm64
          retries: 3
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
